<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>GP Walo 1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Courier New",monospace;color:#cfe9ff;}
canvas#game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:-moz-crisp-edges;background:#000;display:block;z-index:1;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;background:linear-gradient(180deg,rgba(0,0,0,.94),rgba(0,0,0,.99));z-index:20;text-align:center;overflow-y:auto;}
.screen.hidden{display:none;}
.logo{font-size:clamp(22px,6vw,50px);font-weight:bold;letter-spacing:.14em;color:#39e6ff;text-shadow:4px 4px 0 #0b2b3a;line-height:1;margin-bottom:2px;font-family:"Courier New",monospace;}
.logo .pink{color:#ff3d7f;text-shadow:4px 4px 0 #3a0b1c;}
.logo .yellow{color:#ffe14d;text-shadow:4px 4px 0 #3a2b0b;}
.sub{font-size:clamp(9px,2.1vw,13px);letter-spacing:.24em;color:#ffe14d;}
.sub2{font-size:clamp(8px,1.9vw,12px);letter-spacing:.16em;color:#6fa9c9;}
.introtext{max-width:min(94vw,640px);font-size:clamp(10px,2.1vw,13px);line-height:1.7;color:#9fd6ef;text-align:left;padding:12px 14px;border:2px solid rgba(57,230,255,.35);background:rgba(0,8,16,.7);}
.introtext h3{color:#ffe14d;margin:8px 0 4px;letter-spacing:.14em;font-size:clamp(10px,2.1vw,13px);}
.introtext h3:first-child{margin-top:0;}
.introtext b{color:#ff3d7f;}
.credit{font-size:clamp(8px,1.8vw,11px);letter-spacing:.2em;color:#5f88a8;margin-top:4px;}
.credit b{color:#ff3d7f;}
.btn{appearance:none;border:2px solid #39e6ff;background:rgba(57,230,255,.08);color:#dffaff;font-family:inherit;font-weight:bold;font-size:clamp(11px,2.4vw,15px);letter-spacing:.14em;padding:10px 20px;min-width:min(72vw,280px);cursor:pointer;text-shadow:2px 2px 0 #0b2b3a;transition:transform .06s,background .1s;border-radius:0;}
.btn:active{transform:translateY(2px);background:rgba(57,230,255,.25);}
.btn.pink{border-color:#ff3d7f;color:#ffe3ee;text-shadow:2px 2px 0 #3a0b1c;}
.btn.yellow{border-color:#ffe14d;color:#fff9c9;text-shadow:2px 2px 0 #3a2b0b;}
.btn.green{border-color:#63ff9b;color:#dfffec;text-shadow:2px 2px 0 #1a3a24;}
.btn.small{font-size:clamp(9px,1.9vw,12px);padding:8px 14px;min-width:0;}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.loadbar{width:min(78vw,460px);height:18px;border:2px solid #39e6ff;background:#050510;padding:2px;}
#loadfill{height:100%;width:0%;background:repeating-linear-gradient(90deg,#39e6ff 0 6px,#1b93ad 6px 10px);transition:width .1s linear;}
.loadtxt{font-size:clamp(9px,2vw,12px);letter-spacing:.14em;color:#ffe14d;}
.loadpct{font-size:clamp(8px,1.9vw,11px);letter-spacing:.2em;color:#6fa9c9;}
h2{font-size:clamp(14px,3vw,22px);letter-spacing:.2em;color:#39e6ff;text-shadow:3px 3px 0 #0b2b3a;margin-bottom:2px;}
.panel{width:min(94vw,620px);max-height:52vh;overflow-y:auto;border:2px solid rgba(57,230,255,.45);background:rgba(0,8,16,.85);padding:10px;display:flex;flex-direction:column;gap:8px;}
.panel::-webkit-scrollbar{width:5px;}
.panel::-webkit-scrollbar-thumb{background:#39e6ff;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;}
.tile{padding:7px 4px;border:2px solid rgba(57,230,255,.4);background:rgba(0,14,28,.6);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tile:active{transform:scale(.95);}
.tile.sel{border-color:#ffe14d;box-shadow:0 0 12px rgba(255,225,77,.6);}
.tile .nm{font-size:clamp(8px,1.8vw,10px);letter-spacing:.06em;color:#9fd6ef;text-align:center;line-height:1.2;}
.tile .ic{font-size:clamp(14px,3.2vw,20px);}
.tile.lock{opacity:.4;}
.tile canvas{width:52px;height:52px;image-rendering:pixelated;background:#050510;border:1px solid rgba(57,230,255,.3);}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:clamp(9px,2vw,12px);letter-spacing:.08em;}
.srow label{color:#9fd6ef;flex:1;text-align:left;}
.srow .val{width:40px;text-align:right;color:#ffe14d;}
input[type=range]{-webkit-appearance:none;appearance:none;width:min(36vw,150px);height:16px;background:transparent;outline:none;}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:#0d1b2c;border:1px solid rgba(57,230,255,.5);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;margin-top:-5px;background:#39e6ff;border-radius:0;}
input[type=range]::-moz-range-track{height:6px;background:#0d1b2c;border:1px solid rgba(57,230,255,.5);}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:#39e6ff;border:none;border-radius:0;}
.tgl{font-family:inherit;font-size:clamp(9px,1.9vw,11px);letter-spacing:.08em;min-width:70px;padding:5px 9px;cursor:pointer;border:2px solid #2b5f78;background:#08131f;color:#7fa8bd;}
.tgl.on{border-color:#63ff9b;color:#63ff9b;}
.stat{display:flex;justify-content:space-between;font-size:clamp(10px,2.1vw,13px);letter-spacing:.12em;color:#9fd6ef;}
.stat b{color:#ffe14d;}
#controls{position:absolute;inset:0;z-index:12;pointer-events:none;}
#controls.hidden{display:none;}
#stickBase{position:absolute;left:12px;bottom:12px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(57,230,255,.5);background:radial-gradient(circle,rgba(57,230,255,.10),transparent 70%);pointer-events:auto;touch-action:none;}
#stickKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:2px solid #39e6ff;background:rgba(57,230,255,.35);will-change:transform;pointer-events:none;}
.gbtn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;pointer-events:auto;touch-action:none;user-select:none;}
#btnA{right:18px;bottom:26px;width:94px;height:94px;border:3px solid #ff3d7f;color:#ffd7e6;font-size:28px;background:rgba(255,61,127,.25);text-shadow:2px 2px 0 #3a0b1c;}
#btnB{right:128px;bottom:82px;width:72px;height:72px;border:3px solid #ffe14d;color:#fff4c2;font-size:22px;background:rgba(255,225,77,.22);text-shadow:2px 2px 0 #3a2b0b;}
#btnC{right:20px;bottom:136px;width:60px;height:60px;border:3px solid #63ff9b;color:#dfffec;font-size:18px;background:rgba(99,255,155,.22);text-shadow:2px 2px 0 #1a3a24;}
.gbtn.active{filter:brightness(1.8);transform:scale(.94);}
#btnPause{position:absolute;right:10px;top:8px;z-index:14;width:42px;height:42px;border:2px solid rgba(57,230,255,.7);background:rgba(0,14,26,.8);color:#39e6ff;font-size:16px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;touch-action:none;}
#btnPause.hidden{display:none;}
.dialog{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:min(92vw,600px);border:2px solid #39e6ff;background:rgba(0,10,20,.95);padding:8px 10px;z-index:16;display:flex;gap:8px;align-items:flex-start;}
.dialog.hidden{display:none;}
.dialog .who{color:#ffe14d;font-weight:bold;font-size:clamp(10px,2vw,12px);letter-spacing:.1em;margin-bottom:2px;}
.dialog .msg{color:#cfe9ff;font-size:clamp(9px,1.9vw,11px);letter-spacing:.06em;line-height:1.4;}
.dialog .face{font-size:24px;line-height:1;}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="controls" class="hidden">
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div id="btnA" class="gbtn">A</div>
  <div id="btnB" class="gbtn">B</div>
  <div id="btnC" class="gbtn">C</div>
</div>
<div id="btnPause" class="hidden">II</div>

<div class="dialog hidden" id="dialog">
  <div class="face" id="dlgFace">*</div>
  <div style="flex:1">
    <div class="who" id="dlgWho"></div>
    <div class="msg" id="dlgMsg"></div>
  </div>
</div>

<div class="screen" id="scr-intro">
  <div class="logo">GP<span class="pink"> WALO</span> <span class="yellow">1</span></div>
  <div class="sub" id="introSub"></div>
  <div class="introtext" id="introText"></div>
  <button class="btn pink" id="introBtn"></button>
  <div class="credit" id="introCredit"></div>
</div>

<div class="screen hidden" id="scr-load">

  <div class="loadbar"><div id="loadfill"></div></div>
  <div class="loadtxt" id="loadtxt"></div>
  <div class="loadpct" id="loadpct">0%</div>
</div>

<div class="screen hidden" id="scr-menu">

  <div class="sub" id="menuSub"></div>

  </div>

  </div>
  <div class="sub2" id="menuStats"></div>
  <div class="credit" id="menuCredit"></div>
</div>

<div class="screen hidden" id="scr-chars">
  <h2 id="charsTitle"></h2>
  <div class="panel" style="max-height:50vh"><div class="grid" id="charGrid"></div></div>
  <button class="btn small" data-act="back" id="charsBack"></button>
</div>

<div class="screen hidden" id="scr-zones">
  <h2 id="zonesTitle"></h2>
  <div class="panel" style="max-height:50vh"><div class="grid" id="zoneGrid"></div></div>
  <button class="btn small" data-act="back" id="zonesBack"></button>
</div>

<div class="screen hidden" id="scr-shop">
  <h2 id="shopTitle"></h2>
  <div class="sub2" id="shopCreditsLine"></div>
  <div class="panel" style="max-height:50vh"><div class="grid" id="shopGrid"></div></div>
  <button class="btn small" data-act="back" id="shopBack"></button>
</div>

<div class="screen hidden" id="scr-settings">
  <h2 id="settingsTitle"></h2>
  <div class="panel">
    <div class="srow"><label id="lMusic"></label><input id="sMusic" type="range" min="0" max="100"><span class="val" id="vMusic">40</span></div>
    <div class="srow"><label id="lSfx"></label><input id="sSfx" type="range" min="0" max="100"><span class="val" id="vSfx">60</span></div>
    <div class="srow"><label id="lBits"></label><button class="tgl" id="sBits"></button></div>
    <div class="srow"><label id="lAuto"></label><button class="tgl" id="sAuto"></button></div>
    <div class="srow"><label id="lAim"></label><button class="tgl" id="sAim"></button></div>
    <div class="srow"><label id="lShake"></label><button class="tgl" id="sShake"></button></div>
    <div class="srow"><label id="lCtrl"></label><button class="tgl" id="sCtrl"></button></div>
    <div class="srow"><label id="lFs"></label><button class="tgl" id="sFs"></button></div>
    <div class="srow"><label id="lReset"></label><button class="tgl" id="sReset"></button></div>
  </div>
  <button class="btn small" data-act="back" id="setBack"></button>
</div>

<div class="screen hidden" id="scr-scores">
  <h2 id="scoresTitle"></h2>
  <div class="panel">
    <div class="stat"><span id="lBest"></span><b id="rBest">0</b></div>
    <div class="stat"><span id="lLast"></span><b id="rLast">0</b></div>
    <div class="stat"><span id="lZoneM"></span><b id="rZone">1</b></div>
    <div class="stat"><span id="lKills"></span><b id="rKills">0</b></div>
    <div class="stat"><span id="lNpcSaved"></span><b id="rNpc">0</b></div>
    <div class="stat"><span id="lRuns"></span><b id="rRuns">0</b></div>
  </div>
  <button class="btn small" data-act="back" id="scoresBack"></button>
</div>

<div class="screen hidden" id="scr-pause">
  <h2 id="pauseTitle"></h2>
  <button class="btn" data-act="resume" id="btnResume"></button>
  <button class="btn pink" data-act="menu" id="btnMenu1"></button>
</div>

<div class="screen hidden" id="scr-over">
  <div class="logo" style="color:#ff3d7f;text-shadow:4px 4px 0 #3a0b1c;" id="overLogo"></div>
  <div class="sub" id="overScore"></div>
  <div class="sub" id="overZone"></div>
  <div class="sub" id="overBest"></div>
  <button class="btn" data-act="play" id="overRetry"></button>
  <button class="btn pink" data-act="menu" id="btnMenu2"></button>
</div>

<div class="screen hidden" id="scr-zoneclear">
  <div class="logo" style="color:#ffe14d;text-shadow:4px 4px 0 #3a2b0b;" id="zcLogo"></div>
  <div class="sub" id="zcScore"></div>
  <div class="sub" id="zcCred"></div>
  <div class="sub2" id="zcNext"></div>
  <button class="btn" id="zcBtn"></button>
</div>

/* ---------- INDEXEDDB ---------- */
var DB=(function(){
  var NAME='gp_walo_1',STORE='saves',VER=1;
  var dbp=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise(function(res,rej){
      var r;
      try{r=indexedDB.open(NAME,VER);}catch(e){rej(e);return;}
      r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE);};
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){rej(r.error);};
    });
    return dbp;
  }
  return{
    get:function(k){
      return new Promise(function(resolve){
        open().then(function(db){
          try{
            var tx=db.transaction(STORE,'readonly');
            var rq=tx.objectStore(STORE).get(k);
            rq.onsuccess=function(){resolve(rq.result);};
            rq.onerror=function(){resolve(undefined);};
          }catch(e){
            try{var v=localStorage.getItem(NAME+':'+k);resolve(v?JSON.parse(v):undefined);}catch(_){resolve(undefined);}
          }
        }).catch(function(){
          try{var v=localStorage.getItem(NAME+':'+k);resolve(v?JSON.parse(v):undefined);}catch(_){resolve(undefined);}
        });
      });
    },
    set:function(k,v){
      return new Promise(function(resolve){
        open().then(function(db){
          try{
            var tx=db.transaction(STORE,'readwrite');
            var rq=tx.objectStore(STORE).put(v,k);
            rq.onsuccess=function(){resolve();};
            rq.onerror=function(){
              try{localStorage.setItem(NAME+':'+k,JSON.stringify(v));}catch(_){}
              resolve();
            };
          }catch(e){
            try{localStorage.setItem(NAME+':'+k,JSON.stringify(v));}catch(_){}
            resolve();
          }
        }).catch(function(){
          try{localStorage.setItem(NAME+':'+k,JSON.stringify(v));}catch(_){}
          resolve();
        });
      });
    }
  };
})();

    this.master.connect(this.ctx.destination);
    this.musicBus=this.ctx.createGain();this.musicBus.gain.value=Save.data.music*0.25;
    this.musicBus.connect(this.master);
    this.sfxBus=this.ctx.createGain();this.sfxBus.gain.value=Save.data.sfx*0.5;
    this.sfxBus.connect(this.master);
    this.ready=true;
  },

  setMusic:function(v){if(this.musicBus)this.musicBus.gain.value=v*0.25;},

    var C=this.ctx,t=when!==undefined?when:C.currentTime;

    var g=C.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(bus||this.sfxBus);
    o.start(t);o.stop(t+dur+0.03);
  },

var Music={
  name:null,step:0,next:0,
  play:function(name){if(!SONGS[name])return;if(this.name===name)return;this.name=name;this.step=0;if(Sound.ctx)this.next=Sound.ctx.currentTime+0.08;},
  stop:function(){this.name=null;},
  update:function(){
    if(!this.name||!Sound.ready||!Sound.ctx)return;
    var s=SONGS[this.name];if(!s)return;
    var now=Sound.ctx.currentTime;
    if(this.next<now-0.5)this.next=now+0.05;
    var spb=60/s.bpm/4;
    var guard=0;
    while(this.next<now+0.18&&guard++<32){
      this.playStep(this.step,this.next,s);
      this.step=(this.step+1)&15;
      this.next+=spb;
    }
  },
  playStep:function(i,when,s){
    var l=s.lead[i];if(l!=null)Sound.tone(mtof(l),0.14,'square',0.11,null,Sound.musicBus,when);
    var b=s.bass[i];if(b!=null)Sound.tone(mtof(b),0.18,'triangle',0.26,null,Sound.musicBus,when);
    var d=s.drum[i];
    if(d==='k')Sound.kick(when);
    else if(d==='h')Sound.hat(when);
    else if(d==='s')Sound.snare(when);
  }
};

/* ============================================================
   ТЕКСТ НА CANVAS — через настоящий fillText браузера
   Все русские строки приходят из \u-кодов, поэтому браузер
   рисует их корректно.
   ============================================================ */
var textCache={};
function makeTextSprite(str,color,size){
  var key=str+'|'+color+'|'+size;
  if(textCache[key])return textCache[key];
  str=String(str).toUpperCase();
  var meas=document.createElement('canvas').getContext('2d');
  meas.font='bold '+size+'px "Courier New","Consolas",monospace';
  var w=Math.max(1,Math.ceil(meas.measureText(str).width)+2);
  var h=size+3;
  var c=document.createElement('canvas');
  c.width=w;c.height=h;
  var x=c.getContext('2d');
  x.imageSmoothingEnabled=false;
  x.font='bold '+size+'px "Courier New","Consolas",monospace';
  x.textBaseline='top';
  x.fillStyle=color;
  x.fillText(str,1,1);
  try{
    var img=x.getImageData(0,0,w,h);
    var d=img.data;
    for(var i=0;i<d.length;i+=4){
      if(d[i+3]<110){d[i]=0;d[i+1]=0;d[i+2]=0;d[i+3]=0;}
      else{d[i+3]=255;}
    }
    x.putImageData(img,0,0);
  }catch(e){}
  textCache[key]={canvas:c,w:w,h:h};
  return textCache[key];
}
function drawText(str,x,y,color,sc){
  sc=sc||1;
  var size=Math.max(7,Math.round(8*sc));
  var s=makeTextSprite(str,color,size);
  ctx.drawImage(s.canvas,Math.round(x),Math.round(y));
  return x+s.w;
}
function textW(str,sc){
  sc=sc||1;
  var size=Math.max(7,Math.round(8*sc));
  return makeTextSprite(str,'#fff',size).w;
}
function drawTextC(str,cx,y,color,sc){
  sc=sc||1;
  var size=Math.max(7,Math.round(8*sc));
  var s=makeTextSprite(str,color,size);
  ctx.drawImage(s.canvas,Math.round(cx-s.w/2),Math.round(y));
}

/* ---------- СПРАЙТЫ ---------- */
function mkSpr(rows,pal){
  var maxW=0;
  for(var i=0;i<rows.length;i++)if(rows[i].length>maxW)maxW=rows[i].length;
  var h=rows.length;
  var c=document.createElement('canvas');
  c.width=maxW;c.height=h;
  var x=c.getContext('2d');
  for(var r=0;r<h;r++){
    var row=rows[r];
    var off=Math.floor((maxW-row.length)/2);
    for(var ii=0;ii<row.length;ii++){
      var col=pal[row[ii]];
      if(col){x.fillStyle=col;x.fillRect(ii+off,r,1,1);}
    }
  }
  return c;
}

function readKeyboard(){
  var k=Input.keys;
  var x=0,y=0;
  if(k['ArrowLeft']||k['KeyA'])x-=1;
  if(k['ArrowRight']||k['KeyD'])x+=1;
  if(k['ArrowUp']||k['KeyW'])y-=1;
  if(k['ArrowDown']||k['KeyS'])y+=1;
  Input.kx=x;Input.ky=y;
  Input.ka=!!(k['Space']||k['KeyJ']||k['KeyZ']);
  Input.kb=!!(k['ShiftLeft']||k['ShiftRight']||k['KeyK']);
  Input.kc=!!(k['KeyE']||k['KeyF']);
}

(function(){
  var base=document.getElementById('stickBase');
  var knob=document.getElementById('stickKnob');
  var pid=null,cx=0,cy=0,R=60;
  function setK(dx,dy){knob.style.transform='translate('+dx+'px,'+dy+'px)';}
  function down(e){
    if(pid!==null)return;
    pid=e.pointerId;
    try{base.setPointerCapture(pid);}catch(_){}
    var r=base.getBoundingClientRect();
    cx=r.left+r.width/2;cy=r.top+r.height/2;R=r.width*0.4;
    move(e);e.preventDefault();
  }
  function move(e){
    if(e.pointerId!==pid)return;
    var dx=e.clientX-cx,dy=e.clientY-cy;
    var len=Math.hypot(dx,dy);
    if(len>R){dx=dx/len*R;dy=dy/len*R;}
    setK(dx,dy);
    Input.joyX=dx/R;Input.joyY=dy/R;
    e.preventDefault();
  }
  function up(e){
    if(e.pointerId!==pid)return;
    pid=null;Input.joyX=0;Input.joyY=0;
    setK(0,0);e.preventDefault();
  }
  base.addEventListener('pointerdown',down);
  base.addEventListener('pointermove',move);
  base.addEventListener('pointerup',up);
  base.addEventListener('pointercancel',up);
})();

(function(){
  var pid=null,sx=0,sy=0;
  canvas.addEventListener('pointerdown',function(e){
    if(e.pointerType!=='touch'&&e.pointerType!=='pen')return;
    if(pid!==null)return;
    var r=canvas.getBoundingClientRect();
    if(e.clientX-r.left>r.width*0.45)return;
    pid=e.pointerId;
    sx=e.clientX;sy=e.clientY;
    Input.dragX=0;Input.dragY=0;
    try{canvas.setPointerCapture(pid);}catch(_){}
    e.preventDefault();
  });
  canvas.addEventListener('pointermove',function(e){
    if(e.pointerId!==pid)return;
    var dx=e.clientX-sx,dy=e.clientY-sy;
    var R=Math.min(window.innerWidth,window.innerHeight)*0.1;
    var len=Math.hypot(dx,dy);
    var nx=dx/R,ny=dy/R;
    if(len>R){nx=dx/len;ny=dy/len;}
    Input.dragX=nx;Input.dragY=ny;
    e.preventDefault();
  });
  function up(e){
    if(e.pointerId!==pid)return;
    pid=null;Input.dragX=0;Input.dragY=0;
    e.preventDefault();
  }
  canvas.addEventListener('pointerup',up);
  canvas.addEventListener('pointercancel',up);
})();

function bindBtn(id,prop){
  var el=document.getElementById(id);
  function on(e){Input[prop]=true;el.classList.add('active');try{el.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();}
  function off(e){Input[prop]=false;el.classList.remove('active');e.preventDefault();}
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
}
bindBtn('btnA','a');bindBtn('btnB','b');bindBtn('btnC','c');

function goFullscreen(){
  var el=document.documentElement;
  var isFs=document.fullscreenElement||document.webkitFullscreenElement;
  if(isFs)return;
  var rq=el.requestFullscreen||el.webkitRequestFullscreen;
  if(rq){try{var p=rq.call(el,{navigationUI:'hide'});if(p&&p.catch)p.catch(function(){});}catch(e){}}
}
canvas.addEventListener('pointerdown',function(){
  Sound.init();Sound.resume();
  if(Save.data.fs)goFullscreen();
},true);
document.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ---------- СОСТОЯНИЕ ---------- */
var G={
  scene:'intro',player:null,
  bullets:[],ebullets:[],enemies:[],parts:[],pickups:[],pops:[],npcs:[],
  wave:0,score:0,kills:0,zoneId:0,
  queue:[],waveTime:0,phase:'idle',phaseT:0,
  shake:0,flash:0,hitFlash:0,over:false,
  boostSpeed:0,boostDmg:0,boostShield:0
};
function addParts(x,y,n,color,spd,life,size){
  for(var i=0;i<n;i++){
    if(G.parts.length>300)break;
    var a=Math.random()*TAU;
    var s=rand(spd*0.4,spd);
    G.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(life*0.5,life),max:life,color:color,size:size||1});
  }
}
function addPop(x,y,text,color){G.pops.push({x:x,y:y,text:text,color:color||'#ffe14d',life:0.9});}
function shake(a){if(!Save.data.shake)return;G.shake=Math.min(6,G.shake+a);}

function resetGame(zoneId){
  G.zoneId=zoneId;
  var zone=ZONES[zoneId];
  buildFloor(zone);
  G.bullets.length=0;G.ebullets.length=0;G.enemies.length=0;G.parts.length=0;
  G.pickups.length=0;G.pops.length=0;G.npcs.length=0;
  G.score=0;G.kills=0;G.wave=0;G.shake=0;G.flash=0;G.hitFlash=0;G.over=false;
  G.queue=[];G.phase='idle';G.phaseT=0;
  G.boostSpeed=0;G.boostDmg=0;G.boostShield=0;
  var charDef=CHARS[Save.data.charId]||CHARS[0];
  G.player={
    x:VW/2,y:VH/2,vx:0,vy:0,
    hp:charDef.hp,maxHp:charDef.hp,r:4,aim:-Math.PI/2,inv:1.5,
    fireCd:0,dashCd:0,dashT:0,dashDx:0,dashDy:0,
    weapon:Save.data.curWeapon,spr:charDef.spr,
    speedMul:charDef.speed,dmgMul:charDef.dmg,muzzle:0
  };
  var types=['TORG','MED','ENG','PILOT','KID','OLD'];
  var sprites={TORG:'npcTrader',MED:'npcMedic',ENG:'npcEngineer',PILOT:'npcPilot',KID:'npcKid',OLD:'npcOld'};
  var n=randI(2,4);
  for(var i=0;i<n;i++){
    var t=pick(types);
    G.npcs.push({
      x:rand(24,VW-24),y:rand(24,VH-24),
      type:t,name:T.npcNames[t],spr:sprites[t],msg:pick(T.npcMsgs[t]),
      cd:0,saved:false,
      action:t==='TORG'?'credits':(t==='MED'?'heal':'none')
    });
  }
}

function nextWave(){
  G.wave++;
  G.phase='intro';G.phaseT=1.6;
  var zone=ZONES[G.zoneId];
  var q=[];
  var count=4+Math.floor(G.wave*1.6);
  for(var i=0;i<count;i++){
    var list=zone.enemy;
    var t=list[Math.floor(Math.random()*list.length)];
    q.push({type:t,t:i*0.28+Math.random()*0.3});
  }
  if(G.wave%5===0)q.push({type:'boss',t:0.6});
  q.sort(function(a,b){return a.t-b.t;});
  G.queue=q;G.waveTime=0;
  if(G.wave%5===0){Music.play('boss');Sound.boss();}
  else{Music.play(zone.music);Sound.wave();}
}

function spawnEnemy(type){
  var p=G.player;
  var x,y,tries=0;
  do{
    var side=randI(0,3);
    if(side===0){x=rand(14,VW-14);y=10;}
    else if(side===1){x=VW-10;y=rand(14,VH-14);}
    else if(side===2){x=rand(14,VW-14);y=VH-10;}
    else{x=10;y=rand(14,VH-14);}
    tries++;
  }while(tries<12&&dist(x,y,p.x,p.y)<60);
  var w=G.wave+G.zoneId*2;
  var e={type:type,x:x,y:y,r:5,hp:2+Math.floor(w/3),speed:24+w*0.7,dmg:1,score:10,aim:0,wob:rand(0,TAU),hit:0,spr:SPR.grunt};
  if(type==='grunt'){e.spr=SPR.grunt;e.hp=2+Math.floor(w/3);e.speed=26+w*0.8;}
  else if(type==='grunt2'){e.spr=SPR.grunt2;e.hp=3+Math.floor(w/3);e.speed=24+w*0.75;}
  else if(type==='grunt3'){e.spr=SPR.grunt3;e.hp=4+Math.floor(w/3);e.speed=22+w*0.7;}
  else if(type==='flyer'){e.spr=SPR.flyer;e.r=4;e.hp=2+Math.floor(w/4);e.speed=42+w*0.9;e.score=15;}
  else if(type==='brute'){e.spr=SPR.brute;e.r=7;e.hp=8+w;e.speed=15+w*0.4;e.score=30;}
  else if(type==='boss'){e.spr=SPR.boss;e.r=12;e.hp=50+w*12;e.maxHp=e.hp;e.speed=13+w*0.3;e.score=300;e.shootCd=1.6;e.minionCd=3.5;}
  G.enemies.push(e);
}

function playerShoot(){
  var p=G.player;
  var w=WEAPONS[p.weapon]||WEAPONS[1];
  if(p.fireCd>0)return;
  var dmgMul=p.dmgMul*(1+G.boostDmg*0.5)*w.dmg;
  var ang=p.aim;
  var nx=Math.cos(ang),ny=Math.sin(ang);
  for(var i=0;i<w.count;i++){
    var a=ang;
    if(w.spread>0)a+=(Math.random()-0.5)*w.spread;
    G.bullets.push({
      x:p.x+nx*6,y:p.y+ny*6,
      vx:Math.cos(a)*w.speed,vy:Math.sin(a)*w.speed,
      r:1.5,life:w.shortLife||1.2,dmg:dmgMul,
      color:w.color,pierce:!!w.pierce,splash:w.splash||0,
      hitSet:null
    });
  }
  p.fireCd=w.cd;
  p.muzzle=0.06;
  if(p.weapon>=5)Sound.laser();
  else if(p.weapon>=2)Sound.shoot2();
  else Sound.shoot();
  addParts(p.x+nx*7,p.y+ny*7,1,w.color,50,0.12,1);
}

function updateGame(dt){
  var p=G.player;
  if(!p)return;
  readKeyboard();
  var mx=Input.joyX+Input.dragX+Input.kx;
  var my=Input.joyY+Input.dragY+Input.ky;
  var len=Math.hypot(mx,my);
  if(len>1){mx/=len;my/=len;}
  var mag=Math.min(1,len);
  var wantFire=Input.a||Input.ka||Save.data.autoFire;
  var wantDash=Input.b||Input.kb;
  var wantAct=Input.c||Input.kc;

  if(p.inv>0)p.inv-=dt;
  if(p.fireCd>0)p.fireCd-=dt;
  if(p.dashCd>0)p.dashCd-=dt;
  if(p.dashT>0)p.dashT-=dt;
  if(p.muzzle>0)p.muzzle-=dt;

  var targetAim=p.aim;
  var needAim=Save.data.autoAim||Save.data.autoFire;
  if(needAim){
    var best=null,bd=1e9;
    for(var ii=0;ii<G.enemies.length;ii++){
      var e0=G.enemies[ii];
      var d0=dist(p.x,p.y,e0.x,e0.y);
      if(d0<bd){bd=d0;best=e0;}
    }
    if(best)targetAim=Math.atan2(best.y-p.y,best.x-p.x);
    else if(mag>0.15)targetAim=Math.atan2(my,mx);
  }else if(mag>0.15){
    targetAim=Math.atan2(my,mx);
  }
  p.aim=angleLerp(p.aim,targetAim,Math.min(1,dt*16));

  if(wantDash&&p.dashCd<=0){
    p.dashCd=1.1;p.dashT=0.18;p.inv=Math.max(p.inv,0.3);
    if(mag>0.15){p.dashDx=mx;p.dashDy=my;}
    else{p.dashDx=Math.cos(p.aim);p.dashDy=Math.sin(p.aim);}
    Sound.dash();
    addParts(p.x,p.y,10,'#39e6ff',70,0.35,1);
  }

  var baseSpeed=80*p.speedMul*(1+G.boostSpeed*0.4);
  var spd=baseSpeed*mag;
  var mvx=mx,mvy=my;
  if(p.dashT>0){spd=baseSpeed*3.2;mvx=p.dashDx;mvy=p.dashDy;}
  var tvx=mvx*spd,tvy=mvy*spd;
  p.vx+=(tvx-p.vx)*Math.min(1,dt*14);
  p.vy+=(tvy-p.vy)*Math.min(1,dt*14);
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.x=clamp(p.x,8,VW-8);p.y=clamp(p.y,8,VH-8);

  if(wantFire)playerShoot();

  for(var i=0;i<G.npcs.length;i++){
    var npc=G.npcs[i];
    if(npc.cd>0)npc.cd-=dt;
    if(!npc.saved&&dist(npc.x,npc.y,p.x,p.y)<16&&wantAct&&npc.cd<=0){
      npc.cd=0.8;npc.saved=true;
      Save.data.npcSaved++;Save.save();
      Sound.npc();
      addPop(npc.x,npc.y-6,'+25','#63ff9b');
      G.score+=25;
      if(npc.action==='credits'){Save.data.credits+=50;Save.save();addPop(npc.x,npc.y-14,'+50','#ffd040');}
      else if(npc.action==='heal'){p.hp=Math.min(p.maxHp,p.hp+2);addPop(npc.x,npc.y-14,'+2','#ff3d7f');}
      showDialog(npc.name,npc.msg);
    }
  }

  for(var i=G.parts.length-1;i>=0;i--){
    var q=G.parts[i];
    q.x+=q.vx*dt;q.y+=q.vy*dt;
    q.vx*=(1-dt*3);q.vy*=(1-dt*3);
    q.life-=dt;
    if(q.life<=0)G.parts.splice(i,1);
  }

  if(G.phase==='intro'){
    G.phaseT-=dt;
    if(G.phaseT<=0){G.phase='fight';G.waveTime=0;}
  }else if(G.phase==='fight'){
    G.waveTime+=dt;
    while(G.queue.length&&G.queue[0].t<=G.waveTime)spawnEnemy(G.queue.shift().type);
    if(G.queue.length===0&&G.enemies.length===0){
      G.phase='clear';G.phaseT=1.4;
      G.score+=25*G.wave;
      var zone=ZONES[G.zoneId];
      if(G.wave%3===0)G.pickups.push({x:VW/2+rand(-30,30),y:VH/2+rand(-20,20),type:'speed',life:10,t:0});
      if(G.wave%4===0)G.pickups.push({x:VW/2+rand(-30,30),y:VH/2+rand(-20,20),type:'dmg',life:10,t:0});
      if(G.wave%2===0||G.wave%5===0)G.pickups.push({x:VW/2+rand(-40,40),y:VH/2+rand(-20,20),type:'heart',life:10,t:0});
      if(Math.random()<0.5)G.pickups.push({x:VW/2+rand(-40,40),y:VH/2+rand(-30,30),type:'coin',life:10,t:0});
      if(G.wave>=zone.target)setTimeout(function(){completeZone();},1200);
    }
  }else if(G.phase==='clear'){
    G.phaseT-=dt;
    if(G.phaseT<=0)nextWave();
  }

  for(var i=0;i<G.enemies.length;i++){
    var e=G.enemies[i];
    if(e.hit>0)e.hit-=dt;
    var dx=p.x-e.x,dy=p.y-e.y;
    var d=Math.hypot(dx,dy)||1;
    e.aim=Math.atan2(dy,dx);
    if(e.type==='flyer'){
      e.wob+=dt*7;
      var px=-dy/d,py=dx/d;
      e.x+=(dx/d*e.speed+px*Math.sin(e.wob)*32)*dt;
      e.y+=(dy/d*e.speed+py*Math.sin(e.wob)*32)*dt;
    }else if(e.type==='boss'){
      var want=52;var mvb=0;
      if(d>want+10)mvb=1;else if(d<want-10)mvb=-1;
      var px2=-dy/d,py2=dx/d;
      e.wob+=dt*1.4;
      e.x+=(dx/d*e.speed*mvb+px2*Math.cos(e.wob)*20)*dt;
      e.y+=(dy/d*e.speed*mvb+py2*Math.cos(e.wob)*20)*dt;
      e.shootCd-=dt;
      if(e.shootCd<=0){
        e.shootCd=Math.max(0.9,1.9-G.wave*0.04);
        var base=Math.atan2(dy,dx);
        for(var k=-2;k<=2;k++){
          var a=base+k*0.22;
          G.ebullets.push({x:e.x+Math.cos(a)*10,y:e.y+Math.sin(a)*10,vx:Math.cos(a)*65,vy:Math.sin(a)*65,r:2,life:3});
        }
        Sound.tone(180,0.14,'square',0.18,90);
      }
      e.minionCd-=dt;
      if(e.minionCd<=0){e.minionCd=5.5;spawnEnemy('grunt');spawnEnemy('grunt');}
    }else{
      e.x+=dx/d*e.speed*dt;
      e.y+=dy/d*e.speed*dt;
    }
    for(var j=i+1;j<G.enemies.length;j++){
      var o=G.enemies[j];
      var ox=e.x-o.x,oy=e.y-o.y;
      var od=Math.hypot(ox,oy);
      var mind=e.r+o.r;
      if(od>0.001&&od<mind){
        var push=(mind-od)*0.5;
        var ux=ox/od,uy=oy/od;
        e.x+=ux*push;e.y+=uy*push;o.x-=ux*push;o.y-=uy*push;
      }
    }
    e.x=clamp(e.x,6,VW-6);e.y=clamp(e.y,6,VH-6);
    if(p.inv<=0&&dist(e.x,e.y,p.x,p.y)<e.r+p.r-1)damagePlayer();
  }

  for(var i=G.bullets.length-1;i>=0;i--){
    var b=G.bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<-6||b.x>VW+6||b.y<-6||b.y>VH+6){G.bullets.splice(i,1);continue;}
    var hitSome=false;
    for(var j2=0;j2<G.enemies.length;j2++){
      var e2=G.enemies[j2];
      if(b.pierce&&b.hitSet&&b.hitSet.has(j2))continue;
      if(dist(b.x,b.y,e2.x,e2.y)<e2.r+b.r){
        e2.hp-=b.dmg;e2.hit=0.1;
        addParts(b.x,b.y,3,b.color,60,0.2,1);
        Sound.hit();
        if(b.pierce){if(!b.hitSet)b.hitSet=new Set();b.hitSet.add(j2);}
        else hitSome=true;
        if(b.splash>0){
          addParts(b.x,b.y,10,'#ff8a3d',120,0.4,2);
          shake(2);
          for(var k2=0;k2<G.enemies.length;k2++){
            if(k2===j2)continue;
            var e3=G.enemies[k2];
            if(dist(b.x,b.y,e3.x,e3.y)<b.splash){e3.hp-=b.dmg*0.5;e3.hit=0.1;if(e3.hp<=0)killEnemy(k2);}
          }
          Sound.boom();
        }
        if(e2.hp<=0)killEnemy(j2);
        break;
      }
    }
    if(hitSome)G.bullets.splice(i,1);
  }

  for(var i=G.ebullets.length-1;i>=0;i--){
    var b2=G.ebullets[i];
    b2.x+=b2.vx*dt;b2.y+=b2.vy*dt;b2.life-=dt;
    if(b2.life<=0||b2.x<-8||b2.x>VW+8||b2.y<-8||b2.y>VH+8){G.ebullets.splice(i,1);continue;}
    if(p.inv<=0&&dist(b2.x,b2.y,p.x,p.y)<p.r+b2.r){G.ebullets.splice(i,1);damagePlayer();}
  }

  for(var i=G.pickups.length-1;i>=0;i--){
    var kk=G.pickups[i];
    kk.life-=dt;kk.t=(kk.t||0)+dt;
    if(kk.life<=0){G.pickups.splice(i,1);continue;}
    if(dist(kk.x,kk.y,p.x,p.y)<p.r+6){
      G.pickups.splice(i,1);
      Sound.pickup();
      if(kk.type==='heart'){p.hp=Math.min(p.maxHp,p.hp+1);addPop(kk.x,kk.y-5,'+1','#ff3d7f');}
      else if(kk.type==='star'){G.score+=50;addPop(kk.x,kk.y-5,'+50','#ffe14d');}
      else if(kk.type==='coin'){Save.data.credits+=25;Save.save();addPop(kk.x,kk.y-5,'+25','#ffd040');Sound.coin();}
      else if(kk.type==='shield'){G.boostShield=8;addPop(kk.x,kk.y-5,'+','#39e6ff');}
      else if(kk.type==='speed'){G.boostSpeed=8;addPop(kk.x,kk.y-5,'+','#63ff9b');}
      else if(kk.type==='dmg'){G.boostDmg=8;addPop(kk.x,kk.y-5,'+','#ff8a3d');}
      else if(kk.type==='ammo'){addPop(kk.x,kk.y-5,'+','#c0c0c0');}
      addParts(kk.x,kk.y,6,'#fff',60,0.35,1);
    }
  }

  if(G.boostShield>0)G.boostShield-=dt;
  if(G.boostSpeed>0)G.boostSpeed-=dt;
  if(G.boostDmg>0)G.boostDmg-=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*14);
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*3);
  if(G.hitFlash>0)G.hitFlash=Math.max(0,G.hitFlash-dt*3);
  for(var i=G.pops.length-1;i>=0;i--){
    var ss=G.pops[i];ss.y-=dt*14;ss.life-=dt;
    if(ss.life<=0)G.pops.splice(i,1);
  }
}

function killEnemy(idx){
  var e=G.enemies[idx];
  if(!e)return;
  G.enemies.splice(idx,1);
  G.kills++;G.score+=e.score;
  var col=e.type==='boss'?'#b04ad6':(e.type==='brute'?'#ff8a3d':'#7ee081');
  addParts(e.x,e.y,e.type==='boss'?30:(e.type==='brute'?16:10),col,e.type==='boss'?120:90,0.6,e.type==='boss'?2:1);
  Sound.boom();
  shake(e.type==='boss'?5:2);
  if(e.type==='boss')G.flash=0.5;
  addPop(e.x,e.y-7,'+'+e.score,'#ffe14d');
  var r=Math.random();
  if(e.type==='boss'){
    G.pickups.push({x:e.x,y:e.y,type:'heart',life:12,t:0});
    G.pickups.push({x:e.x+10,y:e.y,type:'speed',life:12,t:0});
    G.pickups.push({x:e.x-10,y:e.y,type:'star',life:12,t:0});
    Save.data.credits+=200;Save.save();
  }else if(r<0.08)G.pickups.push({x:e.x,y:e.y,type:'heart',life:10,t:0});
  else if(r<0.18)G.pickups.push({x:e.x,y:e.y,type:'coin',life:10,t:0});
  else if(r<0.25)G.pickups.push({x:e.x,y:e.y,type:'speed',life:10,t:0});
  else if(r<0.31)G.pickups.push({x:e.x,y:e.y,type:'dmg',life:10,t:0});
  else if(r<0.36)G.pickups.push({x:e.x,y:e.y,type:'shield',life:10,t:0});
}

function damagePlayer(){
  var p=G.player;
  if(p.inv>0)return;
  if(G.boostShield>0){
    G.boostShield=0;
    addPop(p.x,p.y-6,'+','#39e6ff');
    addParts(p.x,p.y,14,'#39e6ff',100,0.4,1);
    p.inv=0.8;Sound.hit();return;
  }
  p.hp--;p.inv=1.3;
  G.hitFlash=1;shake(4);Sound.hurt();
  addParts(p.x,p.y,12,'#ff3d7f',90,0.5,1);
  if(p.hp<=0)gameOver();
}

function gameOver(){
  if(G.over)return;
  G.over=true;G.flash=0.7;shake(6);
  Sound.gameOver();Music.play('over');
  Save.data.runs++;
  Save.data.last=G.score;
  Save.data.kills+=G.kills;
  if(G.score>Save.data.best)Save.data.best=G.score;
  if(G.zoneId+1>Save.data.bestZone)Save.data.bestZone=G.zoneId+1;
  Save.save();
  setTimeout(function(){
    if(G.scene==='game'){
      G.scene='over';
      document.getElementById('overScore').textContent=T.score+G.score;
      document.getElementById('overZone').textContent=T.lZone+(G.zoneId+1);
      document.getElementById('overBest').textContent=T.lBest+': '+Save.data.best;
      showScreen('scr-over');
      setControls(false);
    }
  },800);
}

function completeZone(){
  Save.data.zonesCleared=Save.data.zonesCleared||[];
  if(Save.data.zonesCleared.indexOf(G.zoneId)<0)Save.data.zonesCleared.push(G.zoneId);
  var zone=ZONES[G.zoneId];
  Save.data.credits+=zone.reward;
  Save.data.bestZone=Math.max(Save.data.bestZone,G.zoneId+2);
  Save.save();
  Sound.zone();Music.play('victory');
  document.getElementById('zcScore').textContent=T.score+G.score;
  document.getElementById('zcCred').textContent=T.credits+zone.reward;
  var nextZ=G.zoneId+1;
  document.getElementById('zcNext').textContent=nextZ<ZONES.length?(T.nextZone+T.zoneNames[nextZ]):T.allZones;
  document.getElementById('zcBtn').onclick=function(){
    if(nextZ<ZONES.length)startZone(nextZ);
    else gotoMenu();
  };
  G.scene='zoneclear';
  showScreen('scr-zoneclear');
  setControls(false);
}

/* ---------- РЕНДЕР ---------- */
function drawSprite(img,x,y,ang){
  if(ang){
    ctx.save();
    ctx.translate(Math.round(x),Math.round(y));
    ctx.rotate(ang);
    ctx.drawImage(img,-img.width/2,-img.height/2);
    ctx.restore();
  }else{
    ctx.drawImage(img,Math.round(x-img.width/2),Math.round(y-img.height/2));
  }
}

function render(){
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,VW,VH);
  ctx.save();
  if(G.shake>0.1)ctx.translate(Math.round(rand(-G.shake,G.shake)),Math.round(rand(-G.shake,G.shake)));
  if(floorPat){ctx.fillStyle=floorPat;ctx.fillRect(-8,-8,VW+16,VH+16);}
  ctx.strokeStyle='rgba(57,230,255,0.22)';
  ctx.lineWidth=1;
  ctx.strokeRect(3.5,3.5,VW-7,VH-7);

  for(var i=0;i<G.npcs.length;i++){
    var npc=G.npcs[i];
    if(npc.saved)ctx.globalAlpha=0.5;
    drawSprite(SPR[npc.spr],npc.x,npc.y,0);
    if(npc.saved)ctx.globalAlpha=1;
    else{
      var bob=Math.sin(performance.now()*0.004)*1;
      drawText('!',npc.x-1,npc.y-11+bob,'#ffe14d',1);
    }
  }

  for(var i=0;i<G.pickups.length;i++){
    var kk=G.pickups[i];
    var spr=kk.type==='heart'?SPR.heart:(kk.type==='star'?SPR.star:(kk.type==='coin'?SPR.coin:(kk.type==='shield'?SPR.shield:(kk.type==='speed'?SPR.speed:(kk.type==='dmg'?SPR.dmg:SPR.ammo)))));
    var bob2=Math.sin((kk.t||0)*4)*1;
    if(kk.life<3&&Math.floor(kk.life*8)%2===0)continue;
    drawSprite(spr,kk.x,kk.y+bob2,0);
  }

  for(var i=0;i<G.bullets.length;i++){
    var b=G.bullets[i];
    ctx.fillStyle=b.color||'#ffe14d';
    var s=b.pierce?2:1;
    ctx.fillRect(Math.round(b.x)-s,Math.round(b.y)-1,s*2+1,2);
  }

  for(var i=0;i<G.ebullets.length;i++){
    var b2=G.ebullets[i];
    ctx.fillStyle='#ff2d55';
    ctx.fillRect(Math.round(b2.x)-1,Math.round(b2.y)-1,3,3);
    ctx.fillStyle='#ff9ab3';
    ctx.fillRect(Math.round(b2.x),Math.round(b2.y),1,1);
  }

  for(var i=0;i<G.enemies.length;i++){
    var e=G.enemies[i];
    if(e.hit>0){
      ctx.save();
      ctx.globalAlpha=0.85;
      drawSprite(e.spr,e.x,e.y,e.aim+Math.PI/2);
      ctx.restore();
    }else{
      drawSprite(e.spr,e.x,e.y,e.aim+Math.PI/2);
    }
    if(e.type==='boss'&&e.maxHp){
      var w=40;
      var hpw=Math.max(0,Math.round(w*(e.hp/e.maxHp)));
      var bx=Math.round(e.x-w/2),by=Math.round(e.y-e.r-7);
      ctx.fillStyle='#2a0a2e';ctx.fillRect(bx-1,by-1,w+2,4);
      ctx.fillStyle='#ff2d55';ctx.fillRect(bx,by,hpw,2);
    }
  }

  var p=G.player;
  if(p){
    if(p.dashT>0){
      ctx.globalAlpha=0.35;
      drawSprite(SPR[p.spr],p.x-p.dashDx*8,p.y-p.dashDy*8,p.aim+Math.PI/2);
      ctx.globalAlpha=0.15;
      drawSprite(SPR[p.spr],p.x-p.dashDx*16,p.y-p.dashDy*16,p.aim+Math.PI/2);
      ctx.globalAlpha=1;
    }
    if(!(p.inv>0&&Math.floor(p.inv*16)%2===0)){
      drawSprite(SPR[p.spr],p.x,p.y,p.aim+Math.PI/2);
      drawWeapon(p.weapon,p.x,p.y,p.aim);
    }
    if(p.muzzle>0){
      var mx=p.x+Math.cos(p.aim)*8,my=p.y+Math.sin(p.aim)*8;
      ctx.fillStyle='#ffe14d';
      ctx.fillRect(Math.round(mx)-1,Math.round(my)-1,3,3);
      ctx.fillStyle='#fff6c2';
      ctx.fillRect(Math.round(mx),Math.round(my),1,1);
    }
    if(G.boostShield>0){
      ctx.strokeStyle='rgba(57,230,255,'+(0.5+Math.sin(performance.now()*0.01)*0.25)+')';
      ctx.beginPath();
      ctx.arc(Math.round(p.x),Math.round(p.y),9,0,TAU);
      ctx.stroke();
    }
    if(p.dashCd>0){
      ctx.fillStyle='rgba(57,230,255,0.6)';
      ctx.fillRect(Math.round(p.x)-5,Math.round(p.y)+7,Math.round(10*(1-p.dashCd/1.1)),1);
    }
  }

  for(var i=0;i<G.parts.length;i++){
    var q=G.parts[i];
    ctx.globalAlpha=clamp(q.life/q.max,0,1);
    ctx.fillStyle=q.color;
    ctx.fillRect(Math.round(q.x),Math.round(q.y),q.size,q.size);
  }
  ctx.globalAlpha=1;

  for(var i=0;i<G.pops.length;i++){
    var ss=G.pops[i];
    ctx.globalAlpha=clamp(ss.life,0,1);
    drawTextC(ss.text,ss.x,ss.y,ss.color,1);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  if(G.hitFlash>0){
    ctx.fillStyle='rgba(255,45,85,'+(G.hitFlash*0.3)+')';
    ctx.fillRect(0,0,VW,VH);
  }
  if(G.flash>0){
    ctx.fillStyle='rgba(255,255,255,'+(G.flash*0.5)+')';
    ctx.fillRect(0,0,VW,VH);
  }

  drawHUD();
}

function drawHUD(){
  var p=G.player;
  if(!p)return;
  for(var i=0;i<p.maxHp;i++){
    var x=6+i*8,y=4;
    if(i<p.hp)ctx.drawImage(SPR.heart,x,y);
    else{ctx.globalAlpha=0.25;ctx.drawImage(SPR.heart,x,y);ctx.globalAlpha=1;}
  }
  var wname=T.weaponNames[p.weapon-1]||'';
  drawText(T.weapon+wname,6,14,'#63ff9b',1);
  var sc=T.score+G.score;
  drawText(sc,VW-6-textW(sc,1),4,'#ffe14d',1);
  var wtxt=T.wave+G.wave+'/'+ZONES[G.zoneId].target;
  drawTextC(wtxt,VW/2,4,'#39e6ff',1);
  var left=G.enemies.length+G.queue.length;
  if(G.phase==='fight')drawTextC(T.enemies+left,VW/2,14,'#ff9ab3',1);
  drawTextC(T.zoneNames[G.zoneId],VW/2,VH-10,'#9fd6ef',1);
  var cred=T.credits+Save.data.credits;
  drawText(cred,VW-6-textW(cred,1),VH-10,'#ffd040',1);
  var by=VH-20;
  if(G.boostShield>0){drawText(T.shield+Math.ceil(G.boostShield),6,by,'#39e6ff',1);by+=9;}
  if(G.boostSpeed>0){drawText(T.speed+Math.ceil(G.boostSpeed),6,by,'#63ff9b',1);by+=9;}
  if(G.boostDmg>0){drawText(T.dmg+Math.ceil(G.boostDmg),6,by,'#ff8a3d',1);by+=9;}
  if(Save.data.autoFire)drawText(T.auto,6,VH-10,'#ff3d7f',1);

  if(G.phase==='intro'){
    var t=G.phaseT;
    var a=clamp(t>1.2?(1.6-t)/0.4:t/1.2,0,1);
    ctx.globalAlpha=a;
    var isBoss=G.wave%5===0;
    drawTextC(isBoss?T.warning:(T.wave+G.wave),VW/2,VH/2-20,isBoss?'#ff2d55':'#39e6ff',2);
    drawTextC(isBoss?T.boss:T.ready,VW/2,VH/2-2,'#ffe14d',1);
    ctx.globalAlpha=1;
  }else if(G.phase==='clear'){
    var a2=clamp(G.phaseT/1.4,0,1);
    ctx.globalAlpha=Math.min(1,a2*1.6);
    drawTextC(T.waveClear,VW/2,VH/2-6,'#63ff9b',1);
    ctx.globalAlpha=1;
  }
}

/* ---------- ЦИКЛ ---------- */
var lastTime=0,acc=0;var FIXED=1/60;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTime)lastTime=ts;
  var dt=(ts-lastTime)/1000;lastTime=ts;
  if(dt>0.25)dt=0.25;
  if(G.scene==='game'&&!G.over){
    acc+=dt;
    var steps=0;
    while(acc>=FIXED&&steps<5){updateGame(FIXED);acc-=FIXED;steps++;if(G.over)break;}
    if(steps>=5)acc=0;
  }else{
    acc=0;
    for(var i=G.parts.length-1;i>=0;i--){
      var q=G.parts[i];
      q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
      if(q.life<=0)G.parts.splice(i,1);
    }
  }
  render();
}
requestAnimationFrame(loop);

/* ---------- СЕТКИ ---------- */
function buildCharGrid(){
  var g=document.getElementById('charGrid');g.innerHTML='';
  CHARS.forEach(function(c){
    var owned=Save.data.unlockedChars.indexOf(c.id)>=0||c.price===0;
    var div=document.createElement('div');
    div.className='tile'+(Save.data.charId===c.id?' sel':'')+(owned?'':' lock');
    var cv=document.createElement('canvas');
    cv.width=14;cv.height=14;
    var cx2=cv.getContext('2d');
    cx2.imageSmoothingEnabled=false;
    var spr=SPR[c.spr];
    cx2.drawImage(spr,7-spr.width/2|0,7-spr.height/2|0);
    div.appendChild(cv);
    var nm=document.createElement('div');nm.className='nm';nm.textContent=T.charNames[c.id];div.appendChild(nm);
    var info=document.createElement('div');info.className='nm';
    info.style.color=(c.price>0&&!owned)?'#ffd040':'#63ff9b';
    info.textContent=(c.price>0&&!owned)?(c.price+T.priceKr):T.selected;
    div.appendChild(info);
    var desc=document.createElement('div');desc.className='nm';desc.style.color='#888';
    desc.textContent='HP'+c.hp+' SP'+c.speed+' DMG'+c.dmg;
    div.appendChild(desc);
    div.onclick=function(){
      Sound.click();
      if(!owned){
        if(Save.data.credits>=c.price){
          Save.data.credits-=c.price;
          Save.data.unlockedChars.push(c.id);
          Save.save();Sound.buy();buildCharGrid();
        }else{Sound.hurt();return;}
      }
      Save.data.charId=c.id;Save.save();buildCharGrid();
    };
    g.appendChild(div);
  });
}

function buildZoneGrid(){
  var g=document.getElementById('zoneGrid');g.innerHTML='';
  ZONES.forEach(function(z,i){
    var unlocked=i===0||(Save.data.zonesCleared||[]).indexOf(i-1)>=0||i<=Save.data.bestZone-1;
    var div=document.createElement('div');
    div.className='tile'+(unlocked?'':' lock');
    div.innerHTML='<div class="ic">'+(i+1)+'</div><div class="nm">'+T.zoneNames[i]+'</div><div class="nm" style="color:'+(unlocked?'#63ff9b':'#666')+'">'+(unlocked?T.open:T.closed)+'</div>';
    div.onclick=function(){Sound.click();if(unlocked)startZone(i);else Sound.hurt();};
    g.appendChild(div);
  });
}

function buildShopGrid(){
  document.getElementById('shopCreditsLine').innerHTML=T.credits+'<span style="color:#63ff9b">'+Save.data.credits+'</span>';
  var g=document.getElementById('shopGrid');g.innerHTML='';
  Object.keys(WEAPONS).forEach(function(k){
    var w=WEAPONS[k];var id=parseInt(k);
    var owned=Save.data.ownedWeapons.indexOf(id)>=0;
    var div=document.createElement('div');
    div.className='tile'+(Save.data.curWeapon===id?' sel':'')+(owned?'':' lock');

    div.appendChild(cv);

    var info=document.createElement('div');info.className='nm';
    info.style.color=owned?'#63ff9b':'#ffd040';

    div.appendChild(info);
    var desc=document.createElement('div');desc.className='nm';desc.style.color='#888';
    desc.textContent=T.weaponDescs[id-1];div.appendChild(desc);

  document.getElementById('lBest').textContent=T.lBest;
  document.getElementById('lLast').textContent=T.lLast;
  document.getElementById('lZoneM').textContent=T.lZoneM;
  document.getElementById('lKills').textContent=T.lKills;

}

/* ---------- СТАРТ ---------- */
document.getElementById('introBtn').addEventListener('click',function(){
  Sound.init();Sound.resume();Sound.click();
  if(Save.data.fs)goFullscreen();
  document.getElementById('scr-intro').classList.add('hidden');
  runLoading();
});

function runLoading(){
  showScreen('scr-load');
  var fill=document.getElementById('loadfill');
  var txt=document.getElementById('loadtxt');
  var pct=document.getElementById('loadpct');
  var total=T.loadSteps.length;
  var i=0;
  function step(){
    if(i>=total){
      fill.style.width='100%';pct.textContent='100%';
      setTimeout(function(){
        applyResolution();
        G.scene='menu';
        showScreen('scr-menu');
        refreshMenu();
        Music.play('menu');
      },300);
      return;
    }
    txt.textContent=T.loadSteps[i];
    var p=Math.round((i/total)*100);
    fill.style.width=p+'%';
    pct.textContent=p+'%';
    i++;
    setTimeout(step,70+Math.random()*60);
  }
  step();
}

buildSprites();
applyAllText();
applyResolution();
ZONES.forEach(function(z){buildFloor(z);});
Save.load().then(function(){refreshMenu();});
window.addEventListener('beforeunload',function(){Save.save();});
